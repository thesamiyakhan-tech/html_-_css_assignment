<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>41 - Two Breakpoints</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
.layout{
  display:grid;
  grid-template-columns:220px 1fr;
  grid-template-areas:"header header" "sidebar main" "footer footer";
  min-height:100vh; gap:15px; padding:15px;
}
.header{grid-area:header;background:#111;color:white;display:flex;justify-content:space-between;padding:15px 25px;border-radius:10px}
.sidebar{grid-area:sidebar;background:#eee;padding:20px;border-radius:10px;display:flex;flex-direction:column;gap:10px}
.main{grid-area:main}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);padding:10px;text-align:center}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.footer{grid-area:footer;background:#111;color:white;text-align:center;padding:15px;border-radius:10px}

/* BREAKPOINT 1 - Tablet 1024px */
@media(max-width:1024px){
  .layout{grid-template-columns:180px 1fr}
  .products{grid-template-columns:repeat(2,1fr)}
  .header{padding:12px 20px}
}

/* BREAKPOINT 2 - Mobile 600px */
@media(max-width:600px){
  .layout{
    grid-template-columns:1fr;
    grid-template-areas:"header" "sidebar" "main" "footer";
  }
  .header{flex-direction:column;gap:8px}
  .sidebar{flex-direction:row;overflow-x:auto}
  .products{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
  <div class="header"><h2>ShopGrid</h2><span>Home | Products</span></div>
  <div class="sidebar"><span>Men</span><span>Women</span><span>Kids</span><span>Sale</span></div>
  <div class="main">
    <div class="products">
      <div class="card"><img src="https://picsum.photos/300/200?1"><h4>Product 1</h4></div>
      <div class="card"><img src="https://picsum.photos/300/200?2"><h4>Product 2</h4></div>
      <div class="card"><img src="https://picsum.photos/300/200?3"><h4>Product 3</h4></div>
    </div>
  </div>
  <div class="footer">Tested on: 1200px (Desktop) | 1024px (Tablet) | 600px (Mobile)</div>
</div>
</body>
</html>

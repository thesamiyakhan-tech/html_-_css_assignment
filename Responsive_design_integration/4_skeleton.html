<!DOCTYPE html>
<html>
<head>
    <title>Landing Page</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family: Arial;}
        .header{display:flex;justify-content:space-between;padding:20px 60px;border-bottom:1px solid #eee;}
        .menu a{margin-left:20px;text-decoration:none;color:black;}
        .hero{display:flex;padding:60px;align-items:center;}
        .hero-left{width:50%;}
        .hero-right{width:50%;}
        .hero-right img{width:100%;height:400px;object-fit:cover;}
        .hero-left h1{font-size:50px;margin-bottom:20px;}
        .hero-left button{padding:10px 20px;background:black;color:white;margin-top:20px;}
        .products{padding:40px 60px;}
        .product-row{display:flex;gap:20px;margin-top:20px;}
        .p-box{width:25%;height:150px;background:#f2f2f2;border:1px solid #ddd;text-align:center;padding-top:60px;}
    </style>
</head>
<body>
    <div class="header">
        <h2>MY BRAND</h2>
        <div class="menu"><a href="#">Home</a><a href="#">Shop</a><a href="#">About</a><a href="#">Contact</a></div>
    </div>
    <div class="hero">
        <div class="hero-left">
            <h1>Best Collection For You</h1>
            <p>This is my landing page desktop version. This is base layout.</p>
            <button>Shop Now</button>
        </div>
        <div class="hero-right">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600" alt="hero image">
        </div>
    </div>
    <div class="products">
        <h2>Our Products</h2>
        <div class="product-row">
            <div class="p-box">Product 1</div>
            <div class="p-box">Product 2</div>
            <div class="p-box">Product 3</div>
            <div class="p-box">Product 4</div>
        </div>
    </div>
</body>
</html>

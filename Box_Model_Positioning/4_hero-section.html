<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0; box-sizing:border-box} body{font-family:sans-serif}
.hero{position:relative; height:100vh; background:url('https://picsum.photos/1200/800') center/cover; overflow:hidden; display:flex; align-items:center; padding:60px}
.overlay{position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1}
.content{position:relative; z-index:2; color:white; max-width:600px}
.content h1{font-size:50px; margin-bottom:15px} .content p{font-size:18px; margin-bottom:25px; opacity:0.9}
.btn{position:relative; z-index:3; padding:12px 30px; background:#6c5cff; color:white; border:none; border-radius:30px; font-size:16px; cursor:pointer}
.badge{position:absolute; top:30px; right:30px; z-index:3; background:white; color:black; padding:8px 15px; border-radius:20px; font-weight:bold}
</style>
</head>
<body>
<div class="hero">
<div class="overlay"></div>
<div class="badge">New Launch</div>
<div class="content">
<h1>Build Your Future</h1>
<p>We create modern landing pages with position & z-index layering for perfect depth.</p>
<button class="btn">Get Started</button>
</div>
</div>
</body>
</html>

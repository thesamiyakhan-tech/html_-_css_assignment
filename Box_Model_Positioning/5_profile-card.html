<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0; box-sizing:border-box} body{font-family:sans-serif; background:#eef2ff; display:flex; justify-content:center; align-items:center; min-height:100vh}
.card{width:320px; background:white; border-radius:20px; overflow:hidden; box-shadow:0 15px 30px rgba(0,0,0,0.1); text-align:center}
.top{height:100px; background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.img{width:100px; height:100px; border-radius:50%; border:4px solid white; margin:-50px auto 15px; display:block; background:url('https://picsum.photos/200') center/cover}
.name{font-size:22px; font-weight:bold} .role{color:gray; font-size:14px; margin:8px 0 15px}
.stats{display:flex; border-top:1px solid #eee} .stat{flex:1; padding:15px 0; border-right:1px solid #eee} .stat:last-child{border:0} .stat b{display:block; font-size:18px} .stat span{font-size:12px; color:gray}
.btn{margin:20px; padding:10px; width:calc(100% - 40px); border:none; background:#6366f1; color:white; border-radius:30px; cursor:pointer; font-size:15px}
</style>
</head>
<body>
<div class="card">
<div class="top"></div>
<div class="img"></div>
<div class="name">Samiya Khan</div>
<div class="role">Frontend Developer</div>
<div class="stats">
<div class="stat"><b>120</b><span>Posts</span></div>
<div class="stat"><b>2.5k</b><span>Followers</span></div>
<div class="stat"><b>180</b><span>Following</span></div>
</div>
<button class="btn">Follow Profile</button>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box} body{margin:0; overflow-x:hidden; font-family:sans-serif; padding:20px}
.box{width:400px; max-width:100%; background:#f0f0f0; padding:20px; border-radius:10px; overflow-wrap:break-word; overflow:hidden}
img{max-width:100%}
</style>
</head>
<body>
<h3>Overflow Fixed</h3>
<div class="box">
<p>zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz</p>
<img src="https://via.placeholder.com/600x200">
<p>Now the layout won't break, it will stay inside.</p>
</div>
</body>
</html>

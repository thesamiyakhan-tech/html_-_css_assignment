<!DOCTYPE html>
<html>
<head>
<style>
  body{display:flex; gap:30px; padding:40px; background:#f5f5f5; font-family:sans-serif; justify-content:center;}
  .card{width:250px; padding:20px; height:300px;}
  
  /* Card 1 - Sharp */
  .card1{
    border-radius:4px; /* Kam radius = sharp */
    background:#e9ecef; /* Solid background */
    border:1px solid #ccc;
  }
  
  /* Card 2 - Gradient */
  .card2{
    border-radius:16px; /* Medium rounded */
    background:linear-gradient(135deg, #4361ee, #7209b7); /* Gradient background */
    color:white;
  }
  
  /* Card 3 - Pill */
  .card3{
    border-radius:50px; /* Bahut zyada radius = Pill shape */
    background:#212529; /* Dark background */
    border:8px solid transparent;
    background-clip:padding-box;
    border-image:linear-gradient(45deg, #ff00cc, #3333ff) 1;
    /* Modern look */
    border-radius:50px;
    background: #1a1a2e;
    border: 8px solid;
    border-image: linear-gradient(to right, #ff00cc, #3333ff, #00ccff) 1;
    border-radius: 50px;
    color:white;
    /* Simple version for assignment */
    background: #0f1629;
    border: 6px solid #7b2cff;
  }
  .img-box{height:120px; background:rgba(255,255,255,0.7); border-radius:8px; margin-bottom:20px; display:flex; align-items:center; justify-content:center;}
  .card3 .img-box{background:#3a3a4a;}
  h3{margin:0 0 10px 0;}
</style>
</head>
<body>

<div class="card card1">
  <div class="img-box" style="background:#ddd;">🖼️ IMAGE</div>
  <h3>Sharp Card</h3>
  <p>border-radius: 4px<br>background: solid gray</p>
</div>

<div class="card card2">
  <div class="img-box">🖼️ IMAGE</div>
  <h3>Gradient Card</h3>
  <p>border-radius: 16px<br>background: linear-gradient</p>
</div>

<div class="card card3">
  <div class="img-box">🖼️ IMAGE</div>
  <h3>Pill Card</h3>
  <p>border-radius: 50px<br>background: dark + border</p>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f3f4f6;padding:30px}
h1{text-align:center;margin-bottom:30px}
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  max-width: 1200px;
  margin: auto;
}
.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.07);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.card img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.price{color:#16a34a;font-weight:bold}
.card button{margin-top:auto;padding:10px;background:#111;color:white;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<h1>Auto Reflow Products</h1>

<div class="grid">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" alt="shirt">
    <h3>Classic Shirt</h3><p>Premium cotton fabric</p><div class="price">$29</div><button>Buy Now</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400" alt="flowerpot">
    <h3>Flower Pot</h3><p>Decorative ceramic pot</p><div class="price">$19</div><button>Buy Now</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400" alt="bottles">
    <h3>Water Bottles</h3><p>Stylish reusable set</p><div class="price">$25</div><button>Buy Now</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1574258495973-f010dfbb5371?w=400" alt="glasses">
    <h3>Stylish Glasses</h3><p>UV protection eyewear</p><div class="price">$45</div><button>Buy Now</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="mobile">
    <h3>Smart Mobile</h3><p>Latest 5G smartphone</p><div class="price">$499</div><button>Buy Now</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=400" alt="rings">
    <h3>Gold Rings</h3><p>Elegant designer rings</p><div class="price">$199</div><button>Buy Now</button>
  </div>
</div>

</body>
</html>
